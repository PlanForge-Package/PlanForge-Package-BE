# PlanForge 전체 스택 배포용 구성.
#
# 세 서비스가 각자 리포지토리에 있으므로 여기서는 레지스트리에 올라간 이미지를 씁니다.
# 로컬에서 소스로 띄우려면 각 리포에서 `docker build` 후 IMAGE_TAG 를 바꿔 주세요.
#
#   cp .env.example .env   # 값 채우기
#   docker compose up -d
#
# 외부 노출은 FE(3000)만 하고, BE·Core·DB 는 내부 네트워크에만 둡니다.
# Core 는 OPERA 자격 증명을 들고 있어 절대 외부에 열지 않습니다.

name: planforge

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER 를 설정하세요}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 를 설정하세요}
      POSTGRES_DB: ${POSTGRES_DB:-planforge}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-planforge}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  core:
    image: ghcr.io/planforge-package/planforge-package-core:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3002
      SERVICE_API_KEY: ${SERVICE_API_KEY:?SERVICE_API_KEY 를 설정하세요}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      OHIP_BASE_URL: ${OHIP_BASE_URL:?}
      OHIP_APP_KEY: ${OHIP_APP_KEY:?}
      OHIP_CLIENT_ID: ${OHIP_CLIENT_ID:?}
      OHIP_CLIENT_SECRET: ${OHIP_CLIENT_SECRET:?}
      OHIP_USERNAME: ${OHIP_USERNAME:?}
      OHIP_PASSWORD: ${OHIP_PASSWORD:?}
      OHIP_HOTEL_ID: ${OHIP_HOTEL_ID:-}
    networks: [internal]

  be:
    image: ghcr.io/planforge-package/planforge-package-be:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-planforge}?schema=public
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 를 설정하세요 (32자 이상)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      CORE_BASE_URL: http://core:3002
      CORE_API_KEY: ${SERVICE_API_KEY}
      # 리버스 프록시를 앞에 둘 때만 true
      TRUST_PROXY: ${TRUST_PROXY:-false}
      # 기동 시 마이그레이션 적용. 여러 인스턴스가 떠도 한 번만 실행됩니다.
      RUN_MIGRATIONS: 'true'
      RUN_SEED: ${RUN_SEED:-false}
      SEED_PASSWORD: ${SEED_PASSWORD:-}
    networks: [internal]

  fe:
    image: ghcr.io/planforge-package/planforge-package-fe:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    depends_on:
      - be
    environment:
      NODE_ENV: production
      PORT: 3000
      # 컨테이너 내부 주소. 브라우저에 노출되지 않습니다.
      BE_BASE_URL: http://be:3001
      CORE_BASE_URL: http://core:3002
    ports:
      - '${FE_PORT:-3000}:3000'
    networks: [internal]

volumes:
  pgdata:

networks:
  internal:
    driver: bridge
