name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: planforge
          POSTGRES_PASSWORD: planforge
          POSTGRES_DB: planforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U planforge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://planforge:planforge@localhost:5432/planforge_test?schema=public
      # AuthModule 은 32자 미만이면 기동을 거부한다. CI 전용 더미 값이다.
      JWT_SECRET: ci-only-dummy-secret-value-not-used-in-production-0123456789
      JWT_EXPIRES_IN: 8h

    steps:
      - uses: actions/checkout@v4

      # pnpm 버전은 package.json 의 packageManager 를 단일 출처로 삼는다.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm prisma:generate

      # 마이그레이션 SQL 이 실제 PostgreSQL 에 적용되는지 확인한다.
      - name: Prisma migrate deploy
        run: pnpm prisma:deploy

      # 마이그레이션 결과가 schema.prisma 와 어긋나지 않는지 확인한다.
      - name: Prisma schema drift check
        run: pnpm exec prisma migrate diff --from-schema-datasource prisma/schema.prisma --to-schema-datamodel prisma/schema.prisma --exit-code

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
